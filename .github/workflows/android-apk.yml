name: Build RealCricket3D Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Assets/**"
      - "Packages/**"
      - "ProjectSettings/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Build with Unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.6.4f1
          targetPlatform: Android
          androidTargetSdkVersion: AndroidApiLevel35
          androidExportType: androidPackage
          buildMethod: RealCricketAndroidBuild.BuildAndroid
          allowDirtyBuild: true
          customParameters: -quit

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RealCricket3D-Android-APK
          path: Builds/Android/RealCricket3D.apk
          if-no-files-found: error
          retention-days: 14
